<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Week 7 Mini App - Trainer Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #ffe5e5; /* light red/pink background */
      font-family: 'Arial', sans-serif;
    }

    /* Navbar */
    .navbar {
      background-color: #d32f2f;
    }

    /* Trainer Card */
    .trainer-card {
      background-color: white;
      border: 4px solid #d32f2f;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .trainer-card h2 {
      color: #d32f2f;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .trainer-card h5 {
      color: #555;
      margin-bottom: 15px;
    }

    .trainer-card .dex {
      display: inline-block;
      background-color: #d32f2f;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    /* Form Card */
    .card {
      border-radius: 15px;
    }

    .btn-primary {
      background-color: #d32f2f;
      border-color: #d32f2f;
    }

    .btn-primary:hover {
      background-color: #b71c1c;
      border-color: #b71c1c;
    }

    .user-list-item {
      border: 2px solid #d32f2f;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #fff;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="#">IT112 Week 7 - Trainer Card</a>
  </div>
</nav>

<main class="container py-4">

  <!-- Trainer Card -->
  <div class="trainer-card">
    <h2>Trainer Card</h2>
    <h5 id="trainerName">Name: </h5>
    <div class="dex" id="trainerDex">Dex: </div>
  </div>

  <div class="row g-4">

    <!-- Add Trainer Form -->
    <div class="col-lg-5">
      <div class="card shadow-sm p-3">
        <h5 class="text-danger mb-3">Add Trainer</h5>
        <form id="userForm">
          <div class="mb-2">
            <label class="form-label">Name</label>
            <input class="form-control" name="name" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Dex Number</label>
            <input class="form-control" name="dex" type="number" min="1" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Save</button>
        </form>
      </div>
    </div>

    <!-- Trainer List -->
    <div class="col-lg-7">
      <div class="card shadow-sm p-3">
        <h5 class="text-danger mb-3">Trainer List</h5>
        <div id="userList" class="list-group small"></div>
      </div>
    </div>

  </div>
</main>

<script>
const userForm = document.getElementById('userForm');
const trainerName = document.getElementById('trainerName');
const trainerDex = document.getElementById('trainerDex');
const userList = document.getElementById('userList');

// Load saved trainers from localStorage
let trainers = JSON.parse(localStorage.getItem('trainers')) || [];

// Function to show trainers in list
  function showTrainers() {
  userList.innerHTML = '';
  trainers.forEach((t, index) => {
       const item = document.createElement('div');
       item.className = 'user-list-item d-flex justify-content-between align-items-center';
       item.innerHTML = `
       <span>${t.name} - Dex: ${t.dex}</span>
       <button class="btn btn-sm btn-danger delete-btn">Delete</button>
    `;
    userList.appendChild(item);

    // DELETE functionality
    item.querySelector('.delete-btn').addEventListener('click', () => {
        trainers.splice(index, 1);
        localStorage.setItem('trainers', JSON.stringify(trainers));
        showTrainers();
        if (trainerName.textContent.includes(t.name)) {
        trainerName.textContent = `Name: `;
        trainerDex.textContent = `Dex: `;
      }
    });
  });
}

// Initial show on page load
showTrainers();

userForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const name = userForm.name.value;
  const dex = userForm.dex.value;

  // Update trainer card
  trainerName.textContent = `Name: ${name}`;
  trainerDex.textContent = `Dex: ${dex}`;

  // Add new trainer
  trainers.push({ name, dex });
  localStorage.setItem('trainers', JSON.stringify(trainers));

  showTrainers();
  userForm.reset();
});
</script>

</body>
</html>
