<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Trainer List - Pokémon Edition</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* Custom Pokémon Palette */
    :root {
      --poke-red: #ff0000;
      --poke-white: #ffffff;
      --poke-dark: #000000;
    }

    body {
      background-color: #f0f0f0; /* Light grey to make white cards pop */
    }

    /* Top Red Bar */
    .navbar {
      background-color: var(--poke-red) !important;
      border-bottom: 5px solid var(--poke-dark);
    }

    /* Pokémon Style Cards */
    .card {
      border: 2px solid var(--poke-dark);
      border-radius: 15px;
      overflow: hidden;
    }

    .card-title {
      color: var(--poke-red);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Action Button */
    .btn-primary {
      background-color: var(--poke-red);
      border-color: var(--poke-dark);
      font-weight: bold;
    }

    .btn-primary:hover {
      background-color: var(--poke-dark);
      border-color: var(--poke-red);
    }

    /* Input Focus Border */
    .form-control:focus {
      border-color: var(--poke-red);
      box-shadow: 0 0 0 0.25rem rgba(255, 0, 0, 0.25);
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="#">
        <span style="border: 2px solid white; border-radius: 50%; padding: 0 8px; margin-right: 5px;">○</span>
        IT112 Week 7 - Trainer List
    </a>
  </div>
</nav>

<main class="container py-4">
  <div class="row g-4">
    <div class="col-lg-5">
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title">Provide the Trainer’s Name</h5>
          <form id="userForm">
            <div class="mb-2">
              <label class="form-label">Name</label>
              <input class="form-control" name="name" placeholder="e.g. Ash Ketchum" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Email</label>
              <input class="form-control" name="email" type="email" placeholder="ash@pallettown.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Age (optional)</label>
              <input class="form-control" name="age" type="number" min="1">
            </div>
            <button class="btn btn-primary w-100" type="submit"> Join The Adventure!  </button>
          </form>
          <div id="msg" class="mt-3"></div>
        </div>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title">Active Trainers</h5>
          <div id="userList" class="list-group list-group-flush small"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="/js/app.js"></script>
</body>
</html>
